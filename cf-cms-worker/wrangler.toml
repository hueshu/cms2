name = "cf-cms-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
# CLOUDFLARE_API_TOKEN = "your-cloudflare-api-token"
# CLOUDFLARE_API_EMAIL = "your-cloudflare-api-email"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "b932bf4a2ca54a86bab11ab4c01e3162"

[[kv_namespaces]]
binding = "CONFIG_KV"
id = "eb19192119174b29b9b0ce4892673124"

[[d1_databases]]
binding = "DB"
database_name = "cms-database"
database_id = "1bda5adc-168b-49c8-a8ce-4cc751616d60"

[env.production]
vars = { ENVIRONMENT = "production" }
# Set these as secrets: wrangler secret put CLOUDFLARE_API_TOKEN
# wrangler secret put CLOUDFLARE_API_EMAIL

[env.staging]
vars = { ENVIRONMENT = "staging" }
# Set these as secrets: wrangler secret put CLOUDFLARE_API_TOKEN --env staging
# wrangler secret put CLOUDFLARE_API_EMAIL --env staging