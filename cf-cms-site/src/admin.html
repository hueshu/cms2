<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站点管理 - Multi-Site CMS</title>
    <meta name="description" content="站点域名绑定信息管理">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 20px;
            padding: 20px;
        }

        /* Login Form */
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .login-container input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 1rem;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .login-container input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-container button {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .error-message {
            color: #ff4757;
            margin-top: 10px;
            display: none;
        }

        /* Admin Dashboard */
        .admin-container {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e1e8ed;
        }

        .admin-header h1 {
            color: #667eea;
            font-size: 2.5rem;
        }

        .logout-btn {
            padding: 10px 20px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #ff3838;
            transform: translateY(-2px);
        }

        .sites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .site-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            border: 2px solid #e1e8ed;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .site-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .site-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .site-id {
            font-size: 0.9rem;
            color: #999;
            margin-bottom: 5px;
        }

        .site-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .site-description {
            color: #666;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .domains-section {
            border-top: 1px solid #e1e8ed;
            padding-top: 15px;
        }

        .domains-title {
            font-size: 1rem;
            color: #667eea;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .domain-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .domain-item.primary {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .domain-name {
            font-family: monospace;
            color: #333;
        }

        .domain-badge {
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .status-active {
            background: #00c851;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2rem;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 1rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div class="login-container" id="loginContainer">
            <h1>🔐 站点管理</h1>
            <input
                type="password"
                id="passwordInput"
                placeholder="请输入管理密码"
                onkeypress="if(event.key==='Enter') checkPassword()"
            />
            <button onclick="checkPassword()">登录</button>
            <div class="error-message" id="errorMessage">密码错误，请重试</div>
        </div>

        <!-- Admin Dashboard -->
        <div class="admin-container" id="adminContainer">
            <div class="admin-header">
                <h1>🌐 站点域名管理</h1>
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>

            <div class="stats-row" id="statsRow">
                <!-- Stats will be loaded here -->
            </div>

            <div class="sites-grid" id="sitesGrid">
                <div class="loading">正在加载站点信息...</div>
            </div>
        </div>
    </div>

    <script>
        // 站点数据（硬编码，因为这是静态页面）
        const sitesData = [
            {
                id: 'site-001',
                name: '犀牛剪辑',
                description: '专业的视频剪辑服务平台',
                status: 'active',
                domains: [
                    { name: 'cmsceshi.xiniujianji.com', isPrimary: true },
                    { name: 'xiniujianji.com', isPrimary: false }
                ]
            },
            {
                id: 'site-002',
                name: 'BWG87',
                description: '高速VPS服务商',
                status: 'active',
                domains: [
                    { name: 'bwg87.com', isPrimary: true },
                    { name: 'cms.bwg87.com', isPrimary: false }
                ]
            },
            {
                id: 'site-003',
                name: 'Hostwinds VPS',
                description: '美国知名VPS服务商',
                status: 'active',
                domains: [
                    { name: 'hostwindsvps.cn', isPrimary: true },
                    { name: 'cms.hostwindsvps.cn', isPrimary: false }
                ]
            },
            {
                id: 'site-004',
                name: 'ALLCUT',
                description: '智能批量剪辑软件',
                status: 'active',
                domains: [
                    { name: 'allcut.cn', isPrimary: true },
                    { name: 'cms.allcut.cn', isPrimary: false }
                ]
            },
            {
                id: 'site-005',
                name: '万剪',
                description: '批量剪辑视频软件',
                status: 'active',
                domains: [
                    { name: 'wanjian666.com', isPrimary: true },
                    { name: 'cms.wanjian666.com', isPrimary: false }
                ]
            },
            {
                id: 'site-006',
                name: 'Vultr VPS',
                description: 'Vultr官网 - vultr服务器，vultr优惠码',
                status: 'active',
                domains: [
                    { name: 'vultrvps.cn', isPrimary: true },
                    { name: 'cms.vultrvps.cn', isPrimary: false }
                ]
            }
        ];

        const CORRECT_PASSWORD = 'a8752001@@';

        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const errorMessage = document.getElementById('errorMessage');

            if (password === CORRECT_PASSWORD) {
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('adminContainer').style.display = 'block';
                loadSitesData();
                // 保存登录状态
                sessionStorage.setItem('adminLoggedIn', 'true');
            } else {
                errorMessage.style.display = 'block';
                document.getElementById('passwordInput').value = '';
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 3000);
            }
        }

        function logout() {
            sessionStorage.removeItem('adminLoggedIn');
            document.getElementById('adminContainer').style.display = 'none';
            document.getElementById('loginContainer').style.display = 'block';
            document.getElementById('passwordInput').value = '';
        }

        function loadSitesData() {
            // 加载统计数据
            const statsRow = document.getElementById('statsRow');
            const totalDomains = sitesData.reduce((sum, site) => sum + site.domains.length, 0);

            statsRow.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${sitesData.length}</div>
                    <div class="stat-label">站点总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${totalDomains}</div>
                    <div class="stat-label">域名总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${sitesData.filter(s => s.status === 'active').length}</div>
                    <div class="stat-label">活跃站点</div>
                </div>
            `;

            // 加载站点卡片
            const sitesGrid = document.getElementById('sitesGrid');
            sitesGrid.innerHTML = sitesData.map(site => `
                <div class="site-card">
                    <div class="site-id">${site.id}</div>
                    <div class="site-name">${site.name}</div>
                    <span class="status-badge status-${site.status}">${site.status.toUpperCase()}</span>
                    <div class="site-description">${site.description}</div>
                    <div class="domains-section">
                        <div class="domains-title">绑定域名 (${site.domains.length})</div>
                        ${site.domains.map(domain => `
                            <div class="domain-item ${domain.isPrimary ? 'primary' : ''}">
                                <span class="domain-name">${domain.name}</span>
                                ${domain.isPrimary ? '<span class="domain-badge">主域名</span>' : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        // 检查是否已登录
        window.addEventListener('load', () => {
            if (sessionStorage.getItem('adminLoggedIn') === 'true') {
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('adminContainer').style.display = 'block';
                loadSitesData();
            }
        });
    </script>
</body>
</html>
